# CI — the release-environment gates this repository records in its governance docs.
#
# Why these four jobs exist (traceable to docs/marketing/*):
#   - governance   : lint / db schema / architecture governance (the `verify:pre-push` static half)
#   - typecheck    : the FULL tsc project chain (18 projects + remote-main + zcode-cua)
#   - unit         : the COMPLETE root unit suite (the 19,854-test gate from the W7-1 record)
#                    plus the zcode-cli turbo test chains (marketing-plugin / bootstrap / adapters)
#   - desktop-e2e  : the upstream desktop ELECTRON suite in its container, replay-isolated —
#                    the recorded "CI-environment gate" that cannot run in dev sandboxes
#                    (no electron bundle / no display); this job is its home.
#
# Live connector verification (real public ad/organic endpoints) is deliberately NOT part of
# default CI: it depends on external network behavior and is recorded as dated evidence files
# under docs/marketing/evidence/ instead (see MARKETING-DATA-SOURCES.md).

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  HUSKY: "0"

jobs:
  governance:
    name: governance (lint / schema / architecture)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Resolve diff base for changed-scope checks
        id: diffbase
        run: |
          set -euo pipefail
          base=""
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
          else
            base="${{ github.event.before }}"
          fi
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ] \
            || ! git cat-file -e "$base^{commit}" 2>/dev/null; then
            base="$(git rev-parse HEAD~1 2>/dev/null || git rev-parse HEAD)"
          fi
          echo "sha=$base" >> "$GITHUB_OUTPUT"
          echo "diff base: $base"
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run lint
      - run: pnpm run db:schema:check
      - run: pnpm run test:architecture
      - run: pnpm run architecture:check -- --changed
        env:
          ARCHITECTURE_BASE: ${{ steps.diffbase.outputs.sha }}

  typecheck:
    name: typecheck (full tsc chain)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm run typecheck
        env:
          NODE_OPTIONS: --max-old-space-size=8192

  unit:
    name: unit (complete root suite + cli plugin chains)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # Repo convention: plugin dists are build products and the bootstrap seed tests read
      # them (turbo `test` dependsOn `build`). turbo is invoked by its hoisted-root binary
      # path: with `node-linker=hoisted` the turbo bin links only at the repo root, and
      # `pnpm --dir`/`pnpm exec` do not resolve it from workspace subdirectories
      # (validated locally: 25/25 build tasks green via this invocation).
      - name: Build CLI workspace (turbo)
        working-directory: apps/zcode-cli
        run: node ../../node_modules/.bin/turbo run build --concurrency=2
      # WO-G1 sandbox-reset prevention guard (Phase 2, W8): the guard suite itself runs
      # inside the required root unit suite below (fork-isolated project, real temp git
      # repositories). This explicit pre-flight step additionally exercises the guard CLI
      # against the CI checkout itself — a workspace-vs-origin sanity gate with a visible,
      # named CI presence, and the exit code blocks the job on any divergence.
      - name: Reset-guard pre-flight (WO-G1)
        run: pnpm run reset-guard:pre-flight
      # The root unit suite imports @zcode/e2e-report BY PACKAGE NAME (its exports point
      # at dist-node), so its build product must exist before the suite runs — it is the
      # only dist-dependent root-suite import (validated: 2050/2054 files passed without
      # it; the 3 failures were exactly the e2eReporting tests importing this package).
      - name: Build the e2e-report package (root-suite dist dependency)
        run: pnpm --filter @zcode/e2e-report build
      # GitHub's ubuntu-24.04 runner image SHIPS Chrome and exports CHROME_PATH globally.
      # browserDataManager's aix-platform test asserts that no Chrome executable can be
      # resolved, and the resolver honors ambient CHROME_PATH/CHROME_EXECUTABLE — so the
      # runner's leaked env flips that assertion. Unset both for the suite (matches the
      # environment where the recorded W7-1 green run was produced; validated locally:
      # the failing file passes 32/32 together with the e2eReporting files once the
      # e2e-report dist exists and CHROME_PATH is absent).
      - name: Root unit suite (complete, runner-env cleaned)
        run: env -u CHROME_PATH -u CHROME_EXECUTABLE pnpm run test:unit
        env:
          NODE_OPTIONS: --max-old-space-size=4096
      # The three recorded plugin-chain gates from the W7-1 full-environment regression:
      # bootstrap plugin-registry 47/47, adapters plugins 79/79, marketing-plugin 56/56.
      # (The full `turbo run test` fan-out is NOT a CI gate: upstream suites are
      # concurrency-sensitive by the repo's own recorded history — e.g.
      # dynamic-workflow-runtime passes standalone but fails under turbo concurrency.)
      - name: Bootstrap plugin-registry suite (reads the built dists)
        working-directory: apps/zcode-cli/packages/bootstrap
        run: pnpm exec vitest run tests/plugins.test.ts
      - name: Adapters plugin conformance suite
        working-directory: apps/zcode-cli/packages/adapters
        run: pnpm exec vitest run tests/plugins.test.ts
      - name: Marketing plugin suite
        working-directory: apps/zcode-cli/packages/marketing-plugin
        run: pnpm exec vitest run

  desktop-e2e:
    name: desktop e2e (electron, container, replay-isolated)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    env:
      # The container script's DEFAULT_E2E_SPEC also lists upstream-provider.test.ts —
      # which is a REAL-UPSTREAM (capture-mode) spec BY DESIGN (see
      # packages/desktop/test/e2e/helpers/upstream-replay-fixture-resolution.ts:
      # "Upstream provider smoke ... verify the real upstream") and therefore requires
      # E2E_NETWORK_MODE=capture + a real E2E_PROVIDER_API_KEY. It cannot pass in the
      # credentials-free replay-isolated mode this job pins, so it is excluded from the
      # CI preset and recorded as a credentials-gated path (run it manually with a real
      # provider key; evidence in docs/marketing/evidence/2026-10-29-ci-first-run.txt).
      E2E_SPEC: ./test/e2e/container-boot.test.ts,./test/e2e/smoke.test.ts,./test/e2e/e2ecase-regression.test.ts,./test/e2e/task-list-archive-confirmation.test.ts
    steps:
      - uses: actions/checkout@v4
      - name: Run the desktop E2E container suite (replay-admitted specs)
        run: bash scripts/test-desktop-e2e-container.sh
      - name: List E2E artifact tree (diagnosability)
        if: always()
        run: find packages/desktop/.e2e-artifacts packages/desktop/errorShots -type f 2>/dev/null | head -50 || true
      - name: Upload E2E artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: desktop-e2e-artifacts
          path: |
            packages/desktop/.e2e-artifacts/
            packages/desktop/errorShots/
          if-no-files-found: warn
          include-hidden-files: true
